name: Publish agentscli
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - agentscli-v[0-9]*.[0-9]*.[0-9]*

permissions:
  contents: read

concurrency:
  group: publish-agentscli
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'devel-solid/agentscli' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install the pinned standalone pnpm
        run: |
          PNPM_VERSION=$(node -p "require('./package.json').packageManager.slice('pnpm@'.length)")
          export PNPM_VERSION
          curl --fail --silent --show-error --location https://get.pnpm.io/install.sh --output "$RUNNER_TEMP/install-pnpm.sh"
          sh "$RUNNER_TEMP/install-pnpm.sh"
          PNPM_HOME="$HOME/.local/share/pnpm"
          echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
          echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
      - name: Verify the version and immutable source tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag');
          const match = /^agentscli-v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$/.exec(process.env.RELEASE_TAG);
          assert.ok(match, 'Expected an agentscli-vX.Y.Z release tag');
          const version = match[1];
          assert.equal(pkg.name, '@devel-solid/agentscli');
          const manager = /^pnpm@(\d+\.\d+\.\d+)$/.exec(pkg.packageManager);
          assert.ok(manager, 'Expected one exact pnpm version');
          assert.equal(execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim(), manager[1]);
          assert.equal(pkg.version, version);
          const tag = `refs/tags/${process.env.RELEASE_TAG}`;
          assert.equal(execFileSync('git', ['cat-file', '-t', tag], { encoding: 'utf8' }).trim(), 'tag', 'Release tag must be annotated');
          const commit = execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim();
          assert.equal(commit, process.env.GITHUB_SHA, 'Release tag must identify this exact commit');
          const annotation = execFileSync('git', ['for-each-ref', '--format=%(contents)', tag], { encoding: 'utf8' });
          const integrityLines = annotation.split('\n').filter(line => line.startsWith('Integrity:'));
          assert.equal(integrityLines.length, 1, 'Release annotation must contain exactly one Integrity line');
          const integrity = integrityLines[0].slice('Integrity: '.length);
          assert.match(integrity, /^sha512-[A-Za-z0-9+/]{86}==$/);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\nRELEASE_INTEGRITY=${integrity}\n`);
          NODE
      - run: pnpm ci
      - run: pnpm run check
      - run: pnpm run build
      - name: Pack the public package
        run: |
          mkdir -p .tmp/release
          pnpm pack --ignore-scripts --json --out ".tmp/release/devel-solid-agentscli-$RELEASE_VERSION.tgz" > .tmp/release/pack.json
      - name: Inspect the archive and match the reviewed integrity
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { resolve } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = JSON.parse(readFileSync('.tmp/release/pack.json', 'utf8'));
          const filename = `devel-solid-agentscli-${process.env.RELEASE_VERSION}.tgz`;
          const archive = `.tmp/release/${filename}`;
          assert.equal(resolve(packed.filename), resolve(archive));
          assert.equal(packed.name, pkg.name);
          assert.equal(packed.version, process.env.RELEASE_VERSION);
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync(archive)).digest('base64');
          assert.equal(integrity, process.env.RELEASE_INTEGRITY, 'Archive differs from the reviewed candidate');
          assert.equal(packed.integrity, integrity);
          execFileSync(process.execPath, [
            '.agents/skills/agentscli-publish-package/scripts/check.mjs',
            '--repo-root', '.', '--package', 'agentscli', '--archive', archive,
          ], { stdio: 'inherit' });
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_ARCHIVE=${archive}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Reviewed candidate\n\nVersion: ${process.env.RELEASE_VERSION}\n\nCommit: ${process.env.GITHUB_SHA}\n\nIntegrity: ${integrity}\n`);
          NODE
      - name: Publish the inspected archive with Trusted Publishing
        run: |
          set +e
          pnpm publish "$RELEASE_ARCHIVE" --access public --ignore-scripts --no-git-checks --publish-wait-timeout 300000 2>&1 | tee .tmp/release/publish.log
          publish_status=${PIPESTATUS[0]}
          set -e
          PUBLISH_STATUS="$publish_status" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { canVerifyPublication } from './.agents/skills/agentscli-publish-package/scripts/verify-published.mjs';
          const status = Number(process.env.PUBLISH_STATUS);
          const output = readFileSync('.tmp/release/publish.log', 'utf8');
          if (!canVerifyPublication(status, output)) process.exit(status || 1);
          if (status !== 0) console.log('::warning::Upload accepted, but native availability waiting timed out. Verifying the same version without republishing.');
          NODE
      - name: Verify the published identity and integrity
        run: node .agents/skills/agentscli-publish-package/scripts/verify-published.mjs
