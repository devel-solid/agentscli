schema: spec-driven

context: |
  This private npm workspace develops @devel-solid/agentscli and
  @devel-solid/agentscli-hub, each exposing only apply plus help/version.
  The tool monorepo is neither a consumer nor a hub and keeps handwritten English
  AGENTS.md and docs/conventions. There is no source/distribution manifest.
  Three independent agentscli-adm-* skills maintain internal conventions,
  root instructions, and authorized native Git/npm package releases. Four consumer
  and five hub operational skill sources live independently in their owning package
  assets/templates/skills. Deterministic validation belongs to each responsible
  skill; conventions are self-contained dependency leaves without inter-resource
  links. Only skills may declare id/source dependencies through metadata.requires
  pointing to their own requires.yml. Root checks remain unit/type/format only.
  All OpenSpec artifacts in this repository use en-US for natural-language content,
  artifact names, change names, capability names, spec names, requirements,
  scenarios, designs, and tasks.
  Preserve exact technical literals, paths, commands, field names, schema terms,
  fixed string contracts, and quoted source values even when they are not English prose.

rules:
  proposal:
    - Write natural-language content in en-US.
    - Use English kebab-case names for changes, capabilities, and specs.
    - Preserve exact technical literals and contractual string values.
  design:
    - Write natural-language content in en-US.
    - Preserve exact technical literals and contractual string values.
  specs:
    - Write requirements and scenarios in en-US.
    - Preserve exact technical literals and contractual string values.
  tasks:
    - Write task descriptions in en-US.
    - Preserve exact technical literals and contractual string values.
