<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="493" viewBox="0 0 1000 493" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Initialize, write conventions, then build the index</title>
  <desc id="description">Step 1: Run agentscli init to prepare the conventions folder and install three project skills. Step 2: Ask your agent: Create a test-focus convention: one behavior per test. The agent creates .agentscli/conventions/test-focus.md. Step 3: Ask your agent: Generate AGENTS.md from our conventions. Step 4: Open AGENTS.md. Its Test focus link opens the convention; the full rule remains in test-focus.md.</desc>
  <style>
    .panel { fill: #ffffff; stroke: #d1d9e0; }
    .bar { fill: #eef1f4; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .blue { fill: #0969da; }
    .purple { fill: #773bc7; }
    .line { stroke: #d1d9e0; }
    .arrow { stroke: #59636e; }
    .arrow-halo { stroke: #ffffff; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #30363d; }
      .bar { fill: #21262d; }
      .ink { fill: #e6edf3; }
      .muted { fill: #b1bac4; }
      .blue { fill: #79c0ff; }
      .purple { fill: #d2a8ff; }
      .line { stroke: #30363d; }
      .arrow { stroke: #b1bac4; }
      .arrow-halo { stroke: #161b22; }
    }
  </style>

  <rect id="init-card" class="panel" x="24.5" y="8.5" width="951" height="88" rx="10"/>
  <path class="bar" d="M35 9H965Q975 9 975 19V48H25V19Q25 9 35 9Z"/>
  <text class="ink" x="44" y="36" font-size="18" font-weight="600">1. Initialize the project</text>
  <path id="init-divider" class="line" d="M25 48H975"/>
  <text id="init-command" class="ink mono" x="44" y="77.7" font-size="16.5">agentscli init</text>

  <g transform="translate(0 36)">
  <rect id="write-card" class="panel" x="24.5" y="80.5" width="447" height="88" rx="10"/>
  <path class="bar" d="M35 81H461Q471 81 471 91V120H25V91Q25 81 35 81Z"/>
  <text class="ink" x="44" y="107" font-size="18" font-weight="600">2. Ask your agent</text>
  <path id="write-divider" class="line" d="M25 120H471"/>
  <text id="write-request" class="ink" x="44" y="151.07" font-size="15">“Create a test-focus convention: one behavior per test.”</text>

  <g transform="translate(0 -39)">
  <rect class="panel" x="24.5" y="224.5" width="447" height="253" rx="10"/>
  <path class="bar" d="M35 225H461Q471 225 471 235V270H25V235Q25 225 35 225Z"/>
  <text class="ink mono" x="44" y="253" font-size="14.5">.agentscli/conventions/test-focus.md</text>
  <path class="line" d="M25 270H471"/>
  <g class="mono" font-size="16.5">
    <text class="muted mono" x="44" y="302">---</text>
    <text class="ink mono" x="44" y="328"><tspan class="blue">trigger:</tspan> Read when defining test cases.</text>
    <text class="muted mono" x="44" y="354">---</text>
    <text class="ink mono" x="44" y="396"><tspan class="purple">#</tspan> Test focus</text>
    <text class="ink mono" x="44" y="438">- Test one behavior at a time.</text>
  </g>
  </g>

  <rect id="build-card" class="panel" x="528.5" y="80.5" width="447" height="88" rx="10"/>
  <path class="bar" d="M539 81H965Q975 81 975 91V120H529V91Q529 81 539 81Z"/>
  <text class="ink" x="548" y="107" font-size="18" font-weight="600">3. Ask your agent</text>
  <path id="build-divider" class="line" d="M529 120H975"/>
  <text id="build-request" class="ink" x="548" y="151.07" font-size="16.5">“Generate AGENTS.md from our conventions.”</text>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path class="arrow-halo" d="M248 174V180M243 175L248 180L253 175M752 174V180M747 175L752 180L757 175M480 311H520M512 303L520 311L512 319" stroke-width="5"/>
    <path class="arrow" d="M248 174V180M243 175L248 180L253 175M752 174V180M747 175L752 180L757 175M480 311H520M512 303L520 311L512 319" stroke-width="2"/>
  </g>

  <g transform="translate(0 -39)">
  <rect class="panel" x="528.5" y="224.5" width="447" height="253" rx="10"/>
  <path class="bar" d="M539 225H965Q975 225 975 235V302H529V235Q529 225 539 225Z"/>
  <text class="ink" x="548" y="252" font-size="18" font-weight="600">4. Open AGENTS.md</text>
  <text class="ink mono" x="548" y="285" font-size="14.5">AGENTS.md</text>
  <text class="muted" x="954" y="285" text-anchor="end" font-size="14.5">Rendered body</text>
  <path class="line" d="M529 302H975"/>
  <text class="ink" x="548" y="346" font-size="26" font-weight="600">AGENTS.md</text>
  <path class="line" d="M548 362H954"/>
  <circle class="ink" cx="554" cy="396" r="2.5"/>
  <text class="ink" x="570" y="402" font-size="16.5"><tspan class="blue" text-decoration="underline">Test focus</tspan>: Read when defining test cases.</text>
  </g>
  </g>
</svg>
